name: CazaChollos

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar el bot
        run: python bot_chollos.py

      - name: Guardar historial y panel
        run: |
          git config user.name  "cazachollos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html historial_chollos.json
          git commit -m "Actualiza chollos" || echo "Sin cambios que guardar"
          git push
